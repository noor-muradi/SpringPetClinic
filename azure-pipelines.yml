# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- none

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '49cb93a9-691c-45e9-96bf-445e213e3adb'
  imageRepository: 'noormuradispringpetclinic'
  containerRegistry: 'npetclinic.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Docker/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  pool: 'self-hosted'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool: 'self-hosted'
      
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        buildContext: $(Build.SourcesDirectory)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: deploy
  displayName: Deploy to Container App
  jobs:
  - job: deploy
    pool: 'self-hosted'
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'demo'   # Your Azure service connection
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az containerapp update \
            -n petclinic \
            -g demo \
            --image npetclinic.azurecr.io/noormuradispringpetclinic:$(tag) \
            --registry-server npetclinic.azurecr.io
